<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Mi Agenda Deportiva</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 15px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 1.5rem; }
    
    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #334155;
    }
    .player-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }

    .card {
      background-color: #1e293b;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border-left: 4px solid #38bdf8;
    }
    .evento-titulo {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #e2e8f0;
    }
    .canales-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-canal {
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
    }
    .btn-canal:hover { background-color: #38bdf8; color: #0f172a; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📺 Transmisiones en Vivo</h1>

    <div class="player-container" id="box-player">
      <p style="color:#aaa; text-align:center; position:absolute; top:45%; width:100%;">Selecciona un canal para reproducir</p>
    </div>

    <div id="contenedor-agenda">Cargando la agenda...</div>
  </div>

  <script>
    function reproducirCanal(url) {
      const box = document.getElementById('box-player');
      
      // Recreamos el iframe limpio cada vez que seleccionas un canal
      box.innerHTML = `
        <iframe 
          src="${url}" 
          allowfullscreen 
          scrolling="no" 
          allow="encrypted-media; autoplay; picture-in-picture"
          referrerpolicy="no-referrer">
        </iframe>
      `;
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    fetch('agenda.json')
      .then(res => res.json())
      .then(agenda => {
        const contenedor = document.getElementById('contenedor-agenda');
        contenedor.innerHTML = '';

        if (!agenda || agenda.length === 0) {
          contenedor.innerHTML = '<p style="text-align:center;">No hay eventos disponibles.</p>';
          return;
        }

        agenda.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';

          const titulo = document.createElement('div');
          titulo.className = 'evento-titulo';
          titulo.textContent = item.evento;

          const listaCanales = document.createElement('div');
          listaCanales.className = 'canales-list';

          item.opciones.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-canal';
            btn.textContent = opt.canal;
            btn.onclick = () => reproducirCanal(opt.url_real);
            listaCanales.appendChild(btn);
          });

          card.appendChild(titulo);
          card.appendChild(listaCanales);
          contenedor.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('contenedor-agenda').innerHTML = '<p style="text-align:center;">Ocurrió un error al cargar la agenda.</p>';
      });
  </script>

</body>
</html>
