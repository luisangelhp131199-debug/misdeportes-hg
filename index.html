<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deportes en Vivo | MisDeportes-HG</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-main: #07090e;
      --bg-card: #111827;
      --bg-card-hover: #1f293d;
      --accent: #00d2ff;
      --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 15px;
      min-height: 100vh;
    }

    .container { max-width: 950px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }

    .live-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.25);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--danger);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68, 0.7); }
      70% { opacity: 0.4; transform: scale(1.2); box-shadow: 0 0 0 6px rgba(239,68,68, 0); }
      100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68, 0); }
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 16px 12px 42px;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
    }

    .player-wrapper {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 210, 255, 0.1);
      position: relative;
    }

    .player-info-bar {
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Relación de aspecto 16:9 */
    }

    .player-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
      background: #000;
    }

    .player-placeholder {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #07090e 100%);
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
    }

    .player-placeholder svg {
      width: 55px; height: 55px;
      margin-bottom: 12px;
      fill: var(--accent);
      opacity: 0.85;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(0, 210, 255, 0.25);
    }

    .evento-titulo {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .canales-list { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn-canal {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-canal span { color: var(--accent); font-size: 0.75rem; }

    .btn-canal:hover {
      background: rgba(0, 210, 255, 0.1);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-canal.active {
      background: var(--accent-gradient);
      color: #000;
      border-color: transparent;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }
    
    .btn-canal.active span { color: #000; }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 35px; height: 35px;
      animation: spin 1s linear infinite;
      margin: 30px auto;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">
        <span>⚽</span> MisDeportes HG
      </div>
      <div class="live-badge">
        <div class="live-dot"></div> EN VIVO
      </div>
    </header>

    <div class="controls-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="input-buscar" placeholder="Buscar partido, equipo o canal..." oninput="filtrarAgenda()">
      </div>
    </div>

    <!-- REPRODUCTOR PRINCIPAL -->
    <div class="player-wrapper">
      <div id="player-info" class="player-info-bar" style="display: none;">
        <span id="player-status-text">▶ Reproduciendo señal</span>
      </div>
      <div class="player-container" id="box-player">
        <div class="player-placeholder">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
          </svg>
          <p>Selecciona un partido de la agenda para comenzar</p>
        </div>
      </div>
    </div>

    <div class="section-title">📅 Agenda Deportiva (MisDeportes HG)</div>
    <div id="contenedor-agenda"><div class="spinner"></div></div>
  </div>

  <script>
    let agendaGlobal = [];

    function reproducir(urlReal, nombreCanal, btnElement) {
      document.querySelectorAll('.btn-canal').forEach(b => b.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');

      const box = document.getElementById('box-player');
      const infoBar = document.getElementById('player-info');
      const statusText = document.getElementById('player-status-text');

      infoBar.style.display = 'flex';
      statusText.innerHTML = `🔥 Reproduciendo: <b>${nombreCanal}</b>`;

      // Carga directa mediante iframe optimizado
      box.innerHTML = `
        <iframe 
          src="${urlReal}" 
          allowfullscreen 
          scrolling="no" 
          allow="encrypted-media; autoplay; picture-in-picture; fullscreen">
        </iframe>`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderizarAgenda(datos) {
      const contenedor = document.getElementById('contenedor-agenda');
      contenedor.innerHTML = '';

      if (!datos || datos.length === 0) {
        contenedor.innerHTML = '<div class="no-results">No se encontraron eventos disponibles en este momento.</div>';
        return;
      }

      datos.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const titulo = document.createElement('div');
        titulo.className = 'evento-titulo';
        titulo.innerHTML = `⚽ ${item.evento}`;

        const listaCanales = document.createElement('div');
        listaCanales.className = 'canales-list';

        item.opciones.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'btn-canal';
          btn.innerHTML = `<span>▶</span> ${opt.canal}`;
          btn.onclick = (e) => reproducir(opt.url_real, `${item.evento} (${opt.canal})`, e.currentTarget);
          listaCanales.appendChild(btn);
        });

        card.appendChild(titulo);
        card.appendChild(listaCanales);
        contenedor.appendChild(card);
      });
    }

    function filtrarAgenda() {
      const textoBusqueda = document.getElementById('input-buscar').value.toLowerCase();
      const filtrados = agendaGlobal.filter(item => 
        item.evento.toLowerCase().includes(textoBusqueda) || 
        item.opciones.some(op => op.canal.toLowerCase().includes(textoBusqueda))
      );
      renderizarAgenda(filtrados);
    }

    fetch('agenda.json')
      .then(res => res.json())
      .then(agenda => {
        agendaGlobal = agenda;
        renderizarAgenda(agendaGlobal);
      })
      .catch(err => {
        document.getElementById('contenedor-agenda').innerHTML = '<div class="no-results">Error al cargar la agenda. Ejecuta la acción en GitHub para actualizar el JSON.</div>';
      });
  </script>

</body>
</html>
