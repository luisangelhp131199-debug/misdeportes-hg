<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundialTV HG</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #161b22;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #30363d;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: #58a6ff;
        }
        .buscador-container {
            padding: 15px;
            text-align: center;
        }
        #buscador {
            width: 100%;
            max-width: 600px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #21262d;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .grid-peliculas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta {
            background-color: #161b22;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #30363d;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .tarjeta:hover {
            transform: scale(1.03);
        }
        .tarjeta img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #21262d;
        }
        .tarjeta .info {
            padding: 10px;
            font-size: 0.85rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            height: 35px;
        }
        /* Modal del reproductor */
        #modal-reproductor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-contenido {
            position: relative;
            width: 95%;
            max-width: 900px;
            background: #161b22;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #30363d;
        }
        .cerrar-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #da3633;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        #titulo-modal {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #c9d1d9;
        }
        .contenedor-video {
            position: relative;
            width: 100%;
            height: 450px;
            background: black;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 MundialTV HG</h1>
    </header>

    <div class="buscador-container">
        <input type="text" id="buscador" placeholder="Buscar película o serie..." onkeyup="filtrarPeliculas()">
    </div>

    <div id="grid" class="grid-peliculas">
        <!-- Las películas se cargan dinámicamente aquí -->
    </div>

    <!-- Modal Reproductor -->
    <div id="modal-reproductor">
        <div class="modal-contenido">
            <button class="cerrar-modal" onclick="cerrarReproductor()">X</button>
            <h2 id="titulo-modal">Reproduciendo</h2>
            <div class="contenedor-video">
                <video id="videoReproductor" controls autoplay>
                    Tu navegador no soporta la reproducción de video.
                </video>
            </div>
        </div>
    </div>

    <script>
        let listaPeliculas = [];

        // Forzamos la lectura fresca del JSON con ?v= para evitar caché
        fetch('peliculas.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                listaPeliculas = data;
                mostrarPeliculas(listaPeliculas);
            })
            .catch(error => console.error('Error cargando el catálogo:', error));

        function mostrarPeliculas(peliculas) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (peliculas.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#8b949e;">No se encontraron resultados en el JSON</p>';
                return;
            }

            peliculas.forEach(pelicula => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                
                // Si el embed_url es un .mp4 lo reproduce, si no, usa la url principal
                let videoLink = pelicula.embed_url && pelicula.embed_url.includes('.mp4') 
                    ? pelicula.embed_url 
                    : pelicula.url;

                tarjeta.onclick = () => abrirPelicula(pelicula.titulo, videoLink);

                tarjeta.innerHTML = `
                    <img src="${pelicula.poster}" alt="${pelicula.titulo}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Sin+Imagen'">
                    <div class="info">${pelicula.titulo}</div>
                `;
                grid.appendChild(tarjeta);
            });
        }

        function filtrarPeliculas() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtradas = listaPeliculas.filter(p => p.titulo.toLowerCase().includes(texto));
            mostrarPeliculas(filtradas);
        }

        function abrirPelicula(titulo, urlVideo) {
            document.getElementById('titulo-modal').innerText = titulo;
            const videoElem = document.getElementById('videoReproductor');
            
            // Verificamos si es un enlace de video directo o una página web
            if (urlVideo.endsWith('.mp4') || urlVideo.includes('.mp4?')) {
                videoElem.style.display = 'block';
                videoElem.src = urlVideo;
                document.getElementById('modal-reproductor').style.display = 'flex';
                videoElem.play().catch(e => console.log("Autoplay restringido:", e));
            } else {
                // Si es un enlace de Blogspot normal que no dio MP4, lo abrimos en pestaña nueva o aviso
                alert("Este contenido requiere abrirse desde su fuente original.");
                window.open(urlVideo, '_blank');
            }
        }

        function cerrarReproductor() {
            const videoElem = document.getElementById('videoReproductor');
            videoElem.pause();
            videoElem.src = '';
            document.getElementById('modal-reproductor').style.display = 'none';
        }
    </script>
</body>
</html>
