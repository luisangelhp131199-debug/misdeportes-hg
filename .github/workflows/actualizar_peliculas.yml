import asyncio
from playwright.async_api import async_playwright
from bs4 import BeautifulSoup
import json

async def extraer_peliculas():
    url_base = "https://cliver.mom"
    peliculas = []

    print(f"Conectando a {url_base}...")

    async with async_playwright() as p:
        browser = await p.chromium.launch(headless=True)
        page = await browser.new_page(
            user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        )

        try:
            await page.goto(url_base, wait_until="domcontentloaded", timeout=30000)
            await page.wait_for_timeout(2000)

            content = await page.content()
            soup = BeautifulSoup(content, "html.parser")

            # Seleccionar exactamente las tarjetas de contenido basadas en el código fuente real
            articulos = soup.select("article.contenido-p, article.serie")
            print(f"Se encontraron {len(articulos)} elementos en la página principal.")

            for item in articulos:
                link_tag = item.find("a")
                img_tag = item.find("img")
                title_tag = item.find("h2") or item.find(".titulo-p")

                if link_tag and img_tag:
                    link = link_tag.get("href", "")
                    if link.startswith("/"):
                        link = url_base + link

                    title = "Sin título"
                    if title_tag:
                        title = title_tag.text.strip()
                    elif img_tag.get("alt"):
                        title = img_tag.get("alt").strip()

                    poster = img_tag.get("src", "")
                    if poster.startswith("/"):
                        poster = url_base + poster

                    if link and title and poster:
                        # Evitar duplicados
                        if not any(p['url'] == link for p in peliculas):
                            peliculas.append({
                                "titulo": title,
                                "poster": poster,
                                "url": link
                            })

            print(f"Total de títulos únicos recopilados: {len(peliculas)}")

            # Extraer el reproductor iframe interno de cada enlace de película/serie
            for idx, pelicula in enumerate(peliculas):
                try:
                    print(f"[{idx+1}/{len(peliculas)}] Procesando: {pelicula['titulo']}")
                    await page.goto(pelicula['url'], wait_until="domcontentloaded", timeout=15000)
                    await page.wait_for_timeout(1000)

                    p_content = await page.content()
                    p_soup = BeautifulSoup(p_content, "html.parser")

                    # Buscar el iframe de reproducción
                    iframe = p_soup.find("iframe")
                    if iframe and iframe.get("src"):
                        embed_src = iframe.get("src")
                        if embed_src.startswith("//"):
                            embed_src = "https:" + embed_src
                        elif embed_src.startswith("/"):
                            embed_src = url_base + embed_src
                        pelicula["embed_url"] = embed_src
                    else:
                        pelicula["embed_url"] = pelicula['url']

                except Exception as e:
                    print(f"Error procesando {pelicula['titulo']}: {e}")
                    pelicula["embed_url"] = pelicula['url']

        except Exception as e:
            print(f"Error general durante el scraping: {e}")

        await browser.close()

    # Guardar catálogo actualizado
    with open("peliculas.json", "w", encoding="utf-8") as f:
        json.dump(peliculas, f, ensure_ascii=False, indent=2)

    print("Catálogo guardado exitosamente en peliculas.json")

if __name__ == "__main__":
    asyncio.run(extraer_peliculas())
