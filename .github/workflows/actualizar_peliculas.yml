    - name: Ejecutar Scraper de Películas
      run: python scraper_peliculas.py

    - name: Guardar cambios
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add agenda.json peliculas.json
        git commit -m "Actualización automática de agenda y películas" || exit 0
        git push
