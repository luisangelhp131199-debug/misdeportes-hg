import asyncio
from playwright.async_api import async_playwright
from bs4 import BeautifulSoup
import json

async def extraer_peliculas():
    url_base = "https://cliver.mom/lastnews"
    peliculas = []
    total_paginas = 3  # Puedes subirlo si quieres más cantidad de películas

    print("Iniciando extracción avanzada para catálogo propio...")

    async with async_playwright() as p:
        browser = await p.chromium.launch(headless=True)
        page = await browser.new_page(
            user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        )

        try:
            for num_pag in range(1, total_paginas + 1):
                url_pag = f"https://cliver.mom/lastnews/page/{num_pag}/" if num_pag > 1 else url_base
                print(f"Scrapeando página {num_pag}...")
                
                await page.goto(url_pag, wait_until="domcontentloaded", timeout=30000)
                await page.wait_for_timeout(2000)

                content = await page.content()
                soup = BeautifulSoup(content, "html.parser")
                items = soup.select("article, .item, .post, div[class*='item']")

                for item in items:
                    link_tag = item.find("a")
                    img_tag = item.find("img")
                    title_tag = item.find("h2") or item.find(".title") or item.find("span")

                    if link_tag:
                        link = link_tag.get("href", "")
                        if link.startswith("/"):
                            link = "https://cliver.mom" + link

                        title = ""
                        if title_tag:
                            title = title_tag.text.strip()
                        elif img_tag and img_tag.get("alt"):
                            title = img_tag.get("alt").strip()

                        poster = ""
                        if img_tag:
                            poster = (
                                img_tag.get("data-src") or 
                                img_tag.get("src") or 
                                img_tag.get("data-lazy-src") or ""
                            )

                        if poster.startswith("//"):
                            poster = "https:" + poster
                        elif poster.startswith("/"):
                            poster = "https://cliver.mom" + poster

                        if link and title and len(title) > 2:
                            if not any(p['url'] == link for p in peliculas):
                                peliculas.append({
                                    "titulo": title,
                                    "poster": poster,
                                    "url": link
                                })

        except Exception as e:
            print(f"Error durante el scraping: {e}")

        await browser.close()

    # Guardar catálogo completo
    with open("peliculas.json", "w", encoding="utf-8") as f:
        json.dump(peliculas, f, ensure_ascii=False, indent=2)

    print(f"Catálogo generado con éxito. Total: {len(peliculas)} películas.")

if __name__ == "__main__":
    asyncio.run(extraer_peliculas())
