name: Actualizar Peliculas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Ejecutar Scraper de Películas
        run: python scraper_peliculas.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add peliculas.json
          git commit -m "Actualización automática de catálogo de películas" || exit 0
          git push
