name: Actualizar Peliculas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps

      - name: Ejecutar script de scraping
        run: python scraper_peliculas.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add peliculas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar catálogo de películas automáticamente" && git push)
