<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MisPeliculas HG</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --text-color: #ffffff;
            --accent-color: #3b82f6;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            padding: 15px 20px;
            background-color: var(--bg-color);
        }

        #searchInput {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>');
            background-repeat: no-repeat;
            background-position: 12px center;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 10px 20px 20px 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #1e293b;
        }

        .card-title {
            padding: 10px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🎬 MisPeliculas HG</a>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar película...">
    </div>

    <div class="grid" id="peliculasGrid">
        <!-- Las películas se cargarán aquí automáticamente -->
    </div>

    <script>
        let peliculas = [];

        async function cargarPeliculas() {
            try {
                const response = await fetch('peliculas.json?' + new Date().getTime());
                peliculas = await response.json();
                mostrarPeliculas(peliculas);
            } catch (error) {
                console.error("Error al cargar:", error);
                document.getElementById('peliculasGrid').innerHTML = '<p style="grid-column: span 2; text-align: center; color: #ef4444;">Error al cargar el catálogo de películas.</p>';
            }
        }

        function mostrarPeliculas(lista) {
            const grid = document.getElementById('peliculasGrid');
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #94a3b8;">No se encontraron películas.</p>';
                return;
            }

            lista.forEach(pelicula => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    if (pelicula.embed_url && pelicula.embed_url !== '#') {
                        window.location.href = pelicula.embed_url;
                    }
                };

                card.innerHTML = `
                    <img src="${pelicula.poster || ''}" alt="${pelicula.titulo}" onerror="this.src='https://via.placeholder.com/300x450/151c2e/94a3b8?text=Sin+Imagen'">
                    <div class="card-title">${pelicula.titulo}</div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtradas = peliculas.filter(p => p.titulo.toLowerCase().includes(texto));
            mostrarPeliculas(filtradas);
        });

        cargarPeliculas();
    </script>
</body>
</html>
